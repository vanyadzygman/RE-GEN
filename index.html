<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE-GEN: Resume Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-logo">RE·GEN</div>
        <div class="header-sub">Генератор резюме</div>
    </header>

    <div class="app">
        <aside class="form">

            <div class="title">
                ШАБЛОН ОФОРМЛЕННЯ
            </div>
            <div class="options">
                <button class="button">
                    <span class="icon">📄</span>
                    CLASSIC
                </button>
                <button class="button">
                    <span class="icon">🎨</span>
                    MODERN
                </button>
                <button class="button">
                    <span class="icon">✨</span>
                    CREATIVE
                </button>
            </div>
        
            <div class="title">
                ОСОБИСТІ ДАНІ
            </div>

            <div class="title">
                ПРО СЕБЕ
            </div>

            <div class="title">
                ДОСВІД РОБОТИ
            </div>

            <div class="title">
                ОСВІТА
            </div>

        </aside>
    </div>
    
    <script src="src/script.js"></script>
</body>
</html>
